<meta name="theme-color" content="#2a3040">
<script>(function(){var t;try{t=localStorage.getItem('ea-theme');}catch(e){}var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.add(d?'dark':'light');})();</script>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme inline {
    --color-bg: var(--bg);
    --color-bg-2: var(--bg-2);
    --color-tint: var(--tint);
    --color-card: var(--card);
    --color-ink: var(--ink);
    --color-ink-2: var(--ink-2);
    --color-line: var(--line);
    --color-night: var(--night);
    --color-copper: var(--copper);
    --color-copper-ink: var(--copper-ink);
    --color-salmon: var(--salmon);
    --font-sans: "Vazirmatn", system-ui, sans-serif;
    --font-display: "Markazi Text", "Vazirmatn", serif;
  }
  @utility wrap {
    margin-inline: auto;
    width: 100%;
    max-width: 1240px;
    padding-inline: 1rem;
    @media (width >= 768px) { padding-inline: 2rem; }
  }
</style>
